# *** WD eva02 EXAMPLE CONFIGURATION FILE ***
# See CONFIGURATION.md for more help on individual options

[hyvis]
# Related CLI args: --log-level
# Options: "DEBUG" | "INFO" | "WARNING" | "ERROR"
log_level = "ERROR"

[hydrus]
api_url = "http://127.0.0.1:45869"
api_key = "your_api_key_here"

# The tag queries to make to get the files to run inference on. 
[[hydrus.file_queries]]
tags = ["system:limit is 14"]
tag_service_keys = [] # empty == "all known tags"

### Second query example; results are merged with the first
# [[hydrus.file_queries]]
# tags = ["source:pixiv", "my namespace:some value"]
# tag_service_keys = ["abcdef1234567890"]

# Pull files from an open page in hydrus
[[hydrus.page_queries]]
name = "files"
# index = 0  # optional; must use this if multiple pages with same name exist. 0-based

# Preview files to process before inference
# [hydrus.preview]
# page_name = "hyvis preview"
# rejected_page_name = "hyvis rejected"

# Output services: where tags will be written/added to.
[hydrus.output_tag_services]
keys = ["1ffa0013df05b86549f5e9bdf19d1f254fb9527120841f44ebceebe928c7a464"]


# Tags to be removed from files, in case you used added any to files for use with file_queries
# [hydrus.remove_tags]
# tags = ["temp:tagme"]
# tag_service_keys = []


# *** Output filter  (global) ***

# These values apply to all models unless you define a model's own [output_filter]
[output_filter]

# Prefer TagLevelThresholds (TLT) over ScoreThresholds when the model supports it.
# Falls back to ScoreThresholds automatically if not supported.
### You can usually ignore this.
prefer_tag_level_thresholds = true

# Relative offset applied to per-tag thresholds when TLT is active.
# 0.1 increases each threshold by 10% (e.g. 0.80 → 0.88).
# Range: -1.0 to 1.0
### You can usually ignore this.
tag_level_threshold_relative_offset = 0.0

# Default threshold used unless overwritten (eg by category_thresholds).
# TLT uses this if it has missing data.
default_threshold = 0.4


# *** Output selection ***

# Only emit tags from these categories.  
# Empty list -> no categories -> you should probably look at using include_tags
# For a list of available categories please check https://github.com/DraconicDragon/HyVis/blob/main/CONFIGURATION.md#available-categories
output_categories = [
    "rating",
    "general",
    "artist",
    "contributor",
    "copyright",
    "character",
    "meta",
    "species",
    "lore",
]

# Explicitly include these specific tags, regardless of output_categories setting
include_tags = []

# Explicitly drop these specific tags, regardless of output_categories setting
exclude_tags = []


# Per-category threshold overrides.
# Two forms are accepted:
#   category = 0.7                                        plain threshold, override_tlt is false by default
#   category = { threshold = 0.7, override_tlt = true }   also overrides any value TLT has for this category/tag
#
# Tag names with special characters must be quoted.
[output_filter.category_thresholds]
"character" = 0.7
"artist" = 0.9    # most models don't support it anyway and when they do, have low artist accuracy

# *** Tag prefix mapping ***

# Maps category name → prefix prepended to each tag before writing to Hydrus.
# Empty string = no prefix.
[output_filter.tag_prefix_mapping]
"rating" = "rating:"
"general" = ""
"artist" = "creator:"
"copyright" = "series:"
"character" = "character:"
"meta" = "meta:"
"species" = "species:"
"lore" = "lore:"
"contributor" = ""


# *** Models ***

# All models are loaded at the same time and run against the same file set.

[[inference.models]]
model_id = "wd-eva02-large-v3"
source = "/mnt/T7/Projects/GitHub/vibe/models/wd-eva02-large-tagger-v3"
device = "auto"
batch_size = 7
# backend  = "pytorch"   # "pytorch" | "onnx" | "auto"
# precision = "fp16"     # "fp16" | "bf16" | "fp32" | "auto"


[database]
# Path for the SQLite database.
path = "data/hyvis.db"