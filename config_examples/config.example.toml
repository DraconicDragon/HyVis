# *** EXAMPLE CONFIGURATION FILE ***
# This is an example config file that lists pretty much all available options with some small comments
# See CONFIGURATION.md for more help on individual options

[hyvis]
# Related CLI args: --log-level
# Options: "DEBUG" | "INFO" | "WARNING" | "ERROR"
log_level = "WARNING"
infer_only = false

[hydrus]
api_url = "http://127.0.0.1:45869"
api_key = "your_api_key_here"
no_wait = false

# The tag queries to make to get the files to run inference on. 
[[hydrus.tag_queries]]
tags = ["system:limit is 64"]
tag_service_keys = [] # empty == "all known tags"

### Second query example; results are merged with the first
# [[hydrus.tag_queries]]
# tags = ["source:pixiv", "my namespace:some value"]
# tag_service_keys = ["abcdef1234567890"]

# Pull files from an open page in hydrus
[[hydrus.page_queries]]
name = "files"
# index = 0  # optional; must use this if multiple pages with same name exist. 0-based

# Preview files to process before inference
# [hydrus.preview]
# page_name = "hyvis preview"
# rejected_page_name = "hyvis rejected"

# Output services: where tags will be written/added to.
# This setting applies globally to all models.
# It can be overriden per-model (see model section below)
[hydrus.output_tag_services]
keys = ["your_service_key_here"]


# Tags to be removed from files, in case you used added any to files for use with tag_queries
# [[hydrus.remove_tags]]
# tags = ["temp:tagme"]
# tag_service_keys = []


# *** Output filter  (global) ***

# These values apply to all models unless you define a model's own [output_filter]
[output_filter]

# Prefer TagLevelThresholds (TLT) when the model supports it.
# Falls back to default threshold settings automatically if not supported.
### You can usually ignore this.
prefer_tag_level_thresholds = true

# Relative offset applied to per-tag thresholds when TLT is active.
# 0.1 increases each threshold by 10% (e.g. 0.80 -> 0.88).
# Range: -1.0 to 1.0
### You can usually ignore this.
tag_level_threshold_relative_offset = 0.0

# Default threshold used unless overwritten (eg by category_thresholds or tag_thresholds).
# TLT uses this as a fallback.
default_threshold = 0.4


# *** Output selection ***

# Only emit tags from these categories.  
# Empty list -> no categories -> you should probably look at using include_tags
# For a list of available categories please check https://github.com/DraconicDragon/HyVis/blob/main/CONFIGURATION.md#available-categories
allowed_categories = [
    "rating",
    "general",
    #"artist",
    "contributor",
    "copyright",
    "character",
    "meta",
    "species",
    "lore",
]

# Explicitly include these specific tags, regardless of allowed_categories setting
include_tags = [
    # "some_unlisted_meta_tag",
    # "particular_artist_tag",
]

# Explicitly drop these specific tags, regardless of allowed_categories setting
exclude_tags = [
    # "generic_background",
]


# Per-category threshold overrides.
# Two forms are accepted:
#   "category" = 0.7                                        plain threshold, override_tlt is false by default
#   "category" = { threshold = 0.7, override_tlt = true }   also overrides any value TLT has for this category/tag
[output_filter.category_thresholds]
"character" = 0.7
"artist" = 0.9    # most models don't support it anyway and when they do, have low artist accuracy

# Per-tag threshold overrides.  Same two forms as category_thresholds.
# Keys are raw tag names without prefixes, e.g. "artist_name" not "creator:artist_name".
# [output_filter.tag_thresholds]
# "1girl"  = 0.6
# "solo"   = { threshold = 0.65, override_tlt = true }
# "emilia_(re:zero)" = 0.85


# Maximum tags to emit per category, selected by descending score.
#
# Example: limitrating to the single most-confident tag:
# [output_filter.max_tags_per_category]
# "rating" = 1


# Maximum tags to emit per subset of tags
#
# Example: limit JTP-3's/Hydra 3.5's rating to the single most-confident tag:
# We have to do it this way for JTP-3/Hydra 3.5 specifically because the rating tags are all in the "meta" category
# [[output_filter.max_tags_per_subset]]
# tags = ["safe", "questionable", "explicit"]
# limit = 1

# *** Tag prefix mapping ***

# Maps category name -> prefix prepended to each tag before writing to Hydrus.
# Empty string = no prefix.
# Example: tag "fate_(series)" is in "copyright" category; will be pushed to hydrus as "series:fate (series)".
[output_filter.category_tag_prefix_mapping]
"rating" = "rating:"
"general" = ""
"artist" = "creator:"
"copyright" = "series:"
"character" = "character:"
"meta" = "meta:"
"species" = "species:"
"lore" = "lore:"
"contributor" = ""

# Per-tag prefix mapping, overrides category mapping
# Example below is for jtp-3/hydra 3.5/e6 rating tags which doesn't in the model don't have their own category/column 
# [output_filter.tag_prefix_overrides]
# "safe" = "rating:"
# "questionable" = "rating:"
# "explicit" = "rating:"

# [output_filter.tag_replacements]
# "rating:g" = "general" 
# "rating:s" = "sensitive"
# "q" = "questionable"
# "looking over shoulder" = "looking back"


# *** Models ***

# All models are loaded at the same time and run against the same file set.

[inference]
# Close and reload the model session after this many files, or once its memory
# growth exceeds session_recycle_rss_growth_mb, to release accumulated memory.
# The reload resumes from the cache, so nothing is inferred twice. 0 disables
# the respective limit.
session_recycle_files = 2000
session_recycle_rss_growth_mb = 1024

[[inference.models]]
model_id = "wd-swinv2-v3" # Check SUPPORTED_MODELS.md for supported models and their IDs
# source   = "" # Local path to folder or omit/leave empty to auto-download from HuggingFace
device = "auto"
batch_size = 4  # higher = more VRAM usage. Not useful if device resolved to CPU
# backend  = "pytorch"   # "pytorch" | "onnx" | "auto"
# precision = "fp16"     # "fp16" | "bf16" | "fp32" | "auto"

### Second model example - overrides specific output_filter fields and uses its
### own output tag service.
# [[inference.models]]
# model_id   = "wd-eva02-large-v3"
# variant_id = "original"      # optional variant ID (omit for default)
# source     = "/path/to/models/eva02"
# device     = "cuda"
# batch_size = 2

# # Anything that isn't specified here will use the globally set value.
# [inference.models.output_filter]
# default_threshold = 0.5

# [inference.models.output_filter.category_thresholds]
# "character" = { threshold = 0.8, override_tlt = true }

# [inference.models.output_tag_services]
# keys = ["model_specific_service_key_here"]


[database]
# Path for the SQLite database.
# Relative paths are resolved from the directory where you run hyvis.
path = "data/hyvis.db"


# *** Video and animation support ***

# Videos, animated GIFs and APNGs are tagged by sampling frames and merging the
# per-frame results. A dense grid of candidate frames is probed across the
# content window, dead frames (fades, flat dark frames) and near-duplicates
# are dropped, and one frame per visually distinct moment is sent to
# inference. Requires opencv-python-headless for videos (installed
# automatically with HyVis); GIFs and APNGs are decoded with Pillow.
# See CONFIGURATION.md#video for details.
[video]
enabled = true                     # false to keep rejecting video files (animations then use their first frame)
max_frames = 11                   # max frames per file sent to inference
max_frames_at_seconds = 60.0      # duration (seconds) at which the full max_frames is used; shorter clips scale down
probe_multiplier = 3               # probe grid size = multiplier x max_frames, so the filters have alternatives
max_probes = 48                    # hard cap on probed frames per file
include_edges = true               # add the true first and last frame to the probe grid
write_frames = false               # debug: save sampled frames to frames/<file_hash>/ as PNGs

[video.loop]
detect = true                      # compare the first and last frame; a match means a loop, so both edge probes are dropped
single_frame_below_seconds = 1.0   # clips shorter than this cannot say much: one centered frame (0 = disabled)
edges_max_seconds = 0.0            # clips longer than this are assumed to loop: drop the edge probes by duration (0 = disabled)

[video.dedupe]
enabled = true                     # drop probes that are near-duplicates of an already-kept frame
threshold = 0.03                   # mean frame diff below which frames count as duplicates
change_level = 25                  # pixels differing by more than this (gray levels) count as "changed"
max_changed_fraction = 0.01        # max fraction of changed pixels for frames to still be duplicates;
                                   # elements smaller than this fraction of the frame survive dedupe

# Drop probes that are mostly nothingness (flat AND dark, e.g. black frames or
# fade-outs the padding missed) so inference is not wasted on them. Dark
# scenes with real detail are preserved.
[video.low_interest]
enabled = true                     # false to keep all probed frames
min_luminance = 0.15               # mean luminance below which a frame may count as empty
min_std = 0.05                     # luminance std below which a frame counts as flat; only
                                   # frames that are flat AND dark are dropped

# Drop probes that land in fade-to-black/white transitions instead of keeping
# them. Nothing is hunted to replace them, the probe is simply discarded.
[video.fades]
enabled = false                    # drop probes that are fade frames
dark_threshold = 0.10              # mean luminance below which a frame counts as "black"
light_threshold = 0.90             # mean luminance above which a frame counts as "white"
uniformity = 0.08                  # luminance std below which a frame counts as flat
