# *** EXAMPLE CONFIGURATION FILE ***
# This is an example config file that lists pretty much all available options with some small comments
# See CONFIGURATION.md for more help on individual options

[hyvis]
# Related CLI args: --log-level
# Options: "DEBUG" | "INFO" | "WARNING" | "ERROR"
log_level = "WARNING"

[hydrus]
api_url = "http://127.0.0.1:45869"
api_key = "your_api_key_here"

# The tag queries to make to get the files to run inference on. 
[[hydrus.tag_queries]]
tags = ["system:limit is 64"]
tag_service_keys = [] # empty == "all known tags"

### Second query example; results are merged with the first
# [[hydrus.tag_queries]]
# tags = ["source:pixiv", "my namespace:some value"]
# tag_service_keys = ["abcdef1234567890"]

# Pull files from an open page in hydrus
[[hydrus.page_queries]]
name = "files"
# index = 0  # optional; must use this if multiple pages with same name exist. 0-based

# Preview files to process before inference
# [hydrus.preview]
# page_name = "hyvis preview"
# rejected_page_name = "hyvis rejected"

# Output services: where tags will be written/added to.
# This setting applies globally to all models.
# It can be overriden per-model (see model section below)
[hydrus.output_tag_services]
keys = ["your_service_key_here"]


# Tags to be removed from files, in case you used added any to files for use with tag_queries
# [hydrus.remove_tags]
# tags = ["temp:tagme"]
# tag_service_keys = []


# *** Output filter  (global) ***

# These values apply to all models unless you define a model's own [output_filter]
[output_filter]

# Prefer TagLevelThresholds (TLT) over ScoreThresholds when the model supports it.
# Falls back to ScoreThresholds automatically if not supported.
### You can usually ignore this.
prefer_tag_level_thresholds = true

# Relative offset applied to per-tag thresholds when TLT is active.
# 0.1 increases each threshold by 10% (e.g. 0.80 -> 0.88).
# Range: -1.0 to 1.0
### You can usually ignore this.
tag_level_threshold_relative_offset = 0.0

# Default threshold used unless overwritten (eg by category_thresholds).
# TLT uses this if it has missing data.
default_threshold = 0.4


# *** Output selection ***

# Only emit tags from these categories.  
# Empty list -> no categories -> you should probably look at using include_tags
# For a list of available categories please check https://github.com/DraconicDragon/HyVis/blob/main/CONFIGURATION.md#available-categories
output_categories = [
    "rating",
    "general",
    #"artist",
    "contributor",
    "copyright",
    "character",
    "meta",
    "species",
    "lore",
]

# Explicitly include these specific tags, regardless of output_categories setting
include_tags = [
    # "some_unlisted_meta_tag",
    # "particular_artist_tag",
]

# Explicitly drop these specific tags, regardless of output_categories setting
exclude_tags = [
    # "generic_background",
]


# Per-category threshold overrides.
# Two forms are accepted:
#   category = 0.7                                        plain threshold, override_tlt is false by default
#   category = { threshold = 0.7, override_tlt = true }   also overrides any value TLT has for this category/tag
[output_filter.category_thresholds]
"character" = 0.7
"artist" = 0.9    # most models don't support it anyway and when they do, have low artist accuracy

# Per-tag threshold overrides.  Same two forms as category_thresholds.
# Keys are raw tag names without prefixes, e.g. "artist_name" not "creator:artist_name".
#
# [output_filter.tag_thresholds]
# "1girl"  = 0.6
# "solo"   = { threshold = 0.65, override_tlt = true }
# "emilia_(re:zero)" = 0.85


# Maximum tags to emit per category, selected by descending score.
# Omitted categories have no limit.
#
# Example: limit rating to the single most-confident tag:
# [output_filter.max_tags_per_category]
# "rating" = 1

# *** Tag prefix mapping ***

# Maps category name -> prefix prepended to each tag before writing to Hydrus.
# Empty string = no prefix.
# Example: tag "fate_(series)" is in "copyright" category; will be pushed to hydrus as "series:fate (series)".
[output_filter.category_tag_prefix_mapping]
"rating" = "rating:"
"general" = ""
"artist" = "creator:"
"copyright" = "series:"
"character" = "character:"
"meta" = "meta:"
"species" = "species:"
"lore" = "lore:"
"contributor" = ""

# Per-tag prefix mapping, overrides category mapping
# Example below is for jtp-3/e6 rating tags which doesn't in the model don't have their own category/column 
# [output_filter.tag_prefix_overrides]
# "safe" = "rating:"
# "questionable" = "rating:"
# "explicit" = "rating:"


# *** Models ***

# All models are loaded at the same time and run against the same file set.

[[inference.models]]
model_id = "wd-swinv2-v3" # Check SUPPORTED_MODELS.md for supported models and their IDs
# source   = "" # Local path to folder or omit/leave empty to auto-download from HuggingFace
device = "auto"
batch_size = 4  # higher = more VRAM usage. Not useful if device resolved to CPU
# backend  = "pytorch"   # "pytorch" | "onnx" | "auto"
# precision = "fp16"     # "fp16" | "bf16" | "fp32" | "auto"

### Second model example - overrides specific output_filter fields and uses its
### own output tag service.
# [[inference.models]]
# model_id   = "wd-eva02-large-v3"
# source     = "/path/to/models/eva02"
# device     = "cuda"
# batch_size = 2

# # Anything that isn't specified here will use the globally set value.
# [inference.models.output_filter]
# default_threshold = 0.5

# [inference.models.output_filter.category_thresholds]
# "character" = { threshold = 0.8, override_tlt = true }

# [inference.models.output_tag_services]
# keys = ["model_specific_service_key_here"]


[database]
# Path for the SQLite database.
# Relative paths are resolved from the directory where you run hyvis.
path = "data/hyvis.db"
