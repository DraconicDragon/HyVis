[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hyvis"
version = "0.26.0"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "hydrus-api",
    "vibe @ git+https://github.com/DraconicDragon/vibe@ed167d0d1cd6351ad31d5e0ed75de9db864058f8",
    "tomli-w>=1.2.0",
]

[project.scripts]
hyvis = "hyvis.main:cli"
hyvis-push-pending = "hyvis.push_pending:cli"

[tool.hatch.metadata]
allow-direct-references = true
