[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hyvis"
version = "0.28.0"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "hydrus-api",
    "vibe @ git+https://github.com/DraconicDragon/vibe@7bdea7c22821fcbeec8093537b84b27c6f09da15",
    "tomli-w>=1.2.0",
    "pydantic>=2.13.4",
]

[project.scripts]
hyvis = "hyvis.main:cli"
hyvis-push-pending = "hyvis.push_pending:cli"

[tool.hatch.metadata]
allow-direct-references = true
