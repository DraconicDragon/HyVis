[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hyvis"
version = "0.33.2"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.33.0",
    "hydrus-api>=5.3.0",
    "vibe @ git+https://github.com/DraconicDragon/vibe@bb355771c1ade8c9471584a1261ee7d68dbb8374",
    "vibe-result-transforms @ git+https://github.com/DraconicDragon/vibe-result-transforms@12fde856948eaa61795e415c5b691b4d80fef438",
    "tomli-w>=1.2.0",
    "pydantic>=2.4.0,<3",
]

[project.optional-dependencies]
gui = ["PySide6>=6.9.0"]

[project.scripts]
hyvis = "hyvis.main:cli"
hyvis-gui = "hyvis.gui.app:cli"

[tool.ruff.lint]
ignore = [
    "BLE001", # Do not catch blind exception: Exception
    "S110",   # try-except-pass detected
]

[tool.hatch.metadata]
allow-direct-references = true
