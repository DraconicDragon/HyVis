[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hyvis"
version = "0.36.0"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.33.0",
    "hydrus-api>=5.3.0",
    "vibe @ git+https://github.com/DraconicDragon/vibe@93c647eb556648fe5c16a589bf9dc89aab3ac827",
    "vibe-result-transforms @ git+https://github.com/DraconicDragon/vibe-result-transforms@dfafe4aac4e21b926f92766f8cf3299eb800abe1",
    "tomli-w>=1.2.0",
    "pydantic>=2.4.0,<3",
]

[project.optional-dependencies]
gui = ["PySide6>=6.9.0"]

[project.scripts]
hyvis = "hyvis.main:cli"
hyvis-gui = "hyvis.gui.app:cli"

[tool.ruff.lint]
ignore = [
    "BLE001", # Do not catch blind exception: Exception
    "S110",   # try-except-pass detected
]

[tool.hatch.metadata]
allow-direct-references = true
