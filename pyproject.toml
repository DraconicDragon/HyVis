[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hyvis"
version = "0.25.0"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "hydrus-api",
    "vibe @ git+https://github.com/DraconicDragon/vibe@3e5d9b7415814fab6a72c9af6306ec0035c82ce6",
    "tomli-w>=1.2.0",
]

[project.scripts]
hyvis = "hyvis.main:cli"
hyvis-push-pending = "hyvis.push_pending:cli"

[tool.hatch.metadata]
allow-direct-references = true
