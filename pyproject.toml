[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hyvis"
version = "0.30.1"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "hydrus-api",
    #"vibe @ git+https://github.com/DraconicDragon/vibe@7bdea7c22821fcbeec8093537b84b27c6f09da15",
    "vibe-result-transforms @ git+https://github.com/DraconicDragon/vibe-result-transforms@0bd3d2c106aece1f2cfdc63b618658af3dfd3f51",
    "tomli-w>=1.2.0",
    "pydantic>=2.13.4",
]

[project.scripts]
hyvis = "hyvis.main:cli"

[tool.ruff.lint]
ignore = [
    "BLE001", # Do not catch blind exception: Exception
    "S110",   # try-except-pass detected
]

[tool.hatch.metadata]
allow-direct-references = true
