[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hyvis"
version = "0.9.0"
dependencies = [
    "requests",
    "hydrus-api",
    "vibe @ git+https://github.com/DraconicDragon/vibe@b8fb167",
]

[project.scripts]
hyvis = "hyvis.main:cli"

[tool.hatch.metadata]
allow-direct-references = true
