[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hyvis"
version = "0.48.0"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.33.0",
    "hydrus-api>=5.3.0",
    "vibe @ git+https://github.com/DraconicDragon/vibe@d91a4b3312bf779437d2406e58b103edd4e74781",
    "vibe-result-transforms @ git+https://github.com/DraconicDragon/vibe-result-transforms@574869c13282a27d7682ca79f34d52dd26af4113",
    "tomli-w>=1.2.0",
    "pydantic>=2.4.0,<3",
    "av>=18.0.0",
]

[project.optional-dependencies]
gui = ["PySide6-essentials>=6.9.0"]

[project.scripts]
hyvis = "hyvis.main:cli"
hyvis-gui = "hyvis.gui.app:cli"

[tool.ruff.lint]
ignore = [
    "BLE001", # Do not catch blind exception: Exception
    "S110",   # try-except-pass detected
]

[tool.hatch.metadata]
allow-direct-references = true
